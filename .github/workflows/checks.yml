name: Checks

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  api-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Guard immutable Alembic revisions
        env:
          MIGRATION_GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MIGRATION_GUARD_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/check_alembic_immutable.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      - name: Unit and API tests
        env:
          PYTHONPATH: .
        run: pytest tests -m "not integration"

  admin-web-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint admin web
        run: pnpm --filter admin-web lint

      - name: Typecheck admin web
        run: pnpm --filter admin-web typecheck

      - name: Unit test admin web
        run: pnpm --filter admin-web test

      - name: Build admin web
        run: pnpm --filter admin-web build
