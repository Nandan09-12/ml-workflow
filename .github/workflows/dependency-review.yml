name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Detect dependency graph availability
        id: dependency_graph
        uses: actions/github-script@v9
        with:
          script: |
            const { data: repo } = await github.rest.repos.get(context.repo);
            const status = repo.security_and_analysis?.dependency_graph?.status ?? "unknown";
            core.info(`Dependency graph status: ${status}`);
            core.setOutput("enabled", status === "enabled" ? "true" : "false");

      - name: Review dependency changes
        if: steps.dependency_graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Skip dependency review
        if: steps.dependency_graph.outputs.enabled != 'true'
        run: |
          echo "Dependency graph is not enabled for this repository."
          echo "Skipping dependency review until it is enabled in Settings > Security > Advanced Security."
