services:
  integration-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ml_workflow_integration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ml_workflow_integration"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
