services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devdb
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        - DEV=true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    env_file:
      - ./apps/api/.env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      target: dev
    depends_on:
      app:
        condition: service_started
    ports:
      - "3000:3000"
    env_file:
      - ./apps/admin-web/.env.local

  mobile:
    profiles:
      - mobile
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      target: dev
    depends_on:
      app:
        condition: service_started
    ports:
      - "${EXPO_DEV_PORT:-8082}:${EXPO_DEV_PORT:-8082}"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    env_file:
      - ./apps/mobile/.env
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_DEV_HOST: lan
      EXPO_DEV_PORT: "8082"
    volumes:
      - ./apps/mobile:/app/apps/mobile
      - ./packages/api-client:/app/packages/api-client
      - ./packages/shared-types:/app/packages/shared-types
      - mobile_node_modules:/app/apps/mobile/node_modules
      - mobile_expo_cache:/root/.expo
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  mobile_node_modules:
  mobile_expo_cache:
